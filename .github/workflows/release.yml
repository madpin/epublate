name: Release

# PRD M6: tag-triggered publish pipeline. The workflow always builds
# the wheel + sdist and attaches them to the GitHub Release; the
# `publish` job only runs when the maintainer has wired the
# `PYPI_API_TOKEN` repository secret. To migrate to PyPI Trusted
# Publishers, drop the secret check and rely on the `id-token: write`
# permission below.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  # Required for PyPI Trusted Publishers. Harmless if you stick with
  # the API-token flow below.
  id-token: write

jobs:
  verify:
    name: Lint + Types + Tests
    runs-on: ubuntu-latest
    env:
      EPUBLATE_RUN_SNAPSHOTS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --all-extras --dev --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy src/epublate

      - name: pytest
        run: uv run pytest

  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --all-extras --dev --frozen

      - name: Verify tag matches pyproject version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version=$(uv run python -c "import epublate; print(epublate.__version__)")
          echo "tag=${tag} version=${version}"
          test "${tag}" = "${version}"

      - name: uv build
        run: uv build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          # The job always runs on a tag; the *upload* is the no-op
          # until a PYPI_API_TOKEN secret is wired. Switching to a
          # Trusted Publisher? Drop the token guard and the env var
          # below — `id-token: write` (set at the workflow level) is
          # already in place.
          if [ -z "${UV_PUBLISH_TOKEN}" ]; then
            echo "PYPI_API_TOKEN is empty — skipping the actual upload."
            echo "Wire the secret in repo settings to enable publishes."
            exit 0
          fi
          uv publish dist/*

  docker:
    name: Docker image (release)
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
